<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy PWA - 實際運行版</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#005088">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FAF6EE; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E6DFD3; border-radius: 10px; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-neutral-100 p-0 sm:p-4">
    <div class="w-full max-w-md h-[840px] bg-[#FAF6EE] shadow-2xl rounded-none sm:rounded-[40px] border-0 sm:border-8 border-neutral-800 relative flex flex-col overflow-hidden">
        <div class="hidden sm:flex justify-between items-center px-6 pt-3 pb-2 bg-[#FAF6EE] text-xs text-neutral-600 font-medium z-40">
            <span id="status-bar-time">00:00</span>
            <div class="w-20 h-4 bg-neutral-800 rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters text-sm"></i>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto px-5 pt-4 pb-24 custom-scrollbar">
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-[#EBE4D5] mb-5">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-[10px] text-neutral-400 font-bold tracking-wider">CURRENT TIME</div>
                        <div class="text-base font-bold text-neutral-800 mt-0.5" id="live-clock">載入中...</div>
                    </div>
                    <div class="bg-[#E6F0FA] text-[#005088] px-2.5 py-1 rounded-full text-[11px] font-bold">
                        <i class="fa-solid fa-wifi text-[10px] mr-1"></i> PWA 在線
                    </div>
                </div>
                <div class="mt-4 pt-3 border-t border-dashed border-neutral-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="text-3xl text-[#FF823A]"><i class="fa-solid fa-cloud-sun"></i></div>
                        <div>
                            <div class="font-bold text-neutral-800 flex items-center gap-1.5">
                                <span id="trip-destination">未設定目的地</span>
                            </div>
                            <div class="text-xs text-neutral-500 mt-0.5">☀️ 今日局部多雲 · 降雨機率 20%</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold text-neutral-800">24°C</div>
                        <div class="text-[10px] bg-[#FFF0E6] text-[#FF823A] px-2 py-0.5 rounded font-bold mt-0.5">體感舒適</div>
                    </div>
                </div>
            </div>
            <div class="flex justify-between items-center mb-6">
                <div>
                    <input type="text" id="trip-title-input" value="我的新旅程 ✈️" class="text-lg font-bold text-[#005088] bg-transparent border-b border-transparent hover:border-neutral-300 focus:border-[#005088] focus:outline-none tracking-tight pb-0.5 transition" onchange="saveTripTitle(this.value)">
                    <p class="text-[11px] text-neutral-400 mt-1">群組邀請碼：<span class="font-mono bg-neutral-200 px-1 py-0.5 rounded text-neutral-700">LOCAL-MODE</span></p>
                </div>
                <div class="flex gap-1 bg-[#E6DFD3] p-1 rounded-xl">
                    <button class="px-3 py-1 bg-white text-xs font-bold text-[#005088] rounded-lg shadow-xs">Day 1</button>
                </div>
            </div>
            <div id="empty-state" class="text-center py-16 px-4 bg-white rounded-2xl border border-dashed border-[#E6DFD3] text-neutral-400">
                <div class="text-4xl mb-3 text-[#E6DFD3]"><i class="fa-solid fa-map-marked-alt"></i></div>
                <p class="text-sm font-medium">今天還沒有安排任何行程景點唷！</p>
                <p class="text-xs text-neutral-400 mt-1">點擊下方按鈕，開始打造你的專屬旅行手帳吧！</p>
            </div>
            <div id="timeline-flow" class="relative pl-4 border-l-2 border-dashed border-[#005088]/20 ml-2.5 space-y-6 hidden"></div>
            <div class="mt-8 flex justify-center">
                <button onclick="openModal()" class="bg-[#005088] hover:bg-[#003d66] text-white text-xs font-bold px-6 py-3 rounded-full shadow-md active:scale-95 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增行程景點
                </button>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-20 bg-white border-t border-[#EBE4D5] px-6 flex justify-between items-center z-40">
            <button class="flex flex-col items-center gap-1 text-[#005088]">
                <div class="text-lg"><i class="fa-solid fa-calendar-day"></i></div>
                <span class="text-[10px] font-bold">今日行程</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-neutral-400 opacity-50 cursor-not-allowed">
                <div class="text-lg"><i class="fa-solid fa-map-location-dot"></i></div>
                <span class="text-[10px] font-medium">地圖模式</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-neutral-400 opacity-50 cursor-not-allowed">
                <div class="text-lg"><i class="fa-solid fa-user-group"></i></div>
                <span class="text-[10px] font-medium">多人共編</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-neutral-400" onclick="clearAllData()">
                <div class="text-lg"><i class="fa-solid fa-trash-can text-red-400"></i></div>
                <span class="text-[10px] font-medium text-red-400">清空重來</span>
            </button>
        </div>
        <div id="add-modal" class="absolute inset-0 bg-black/50 z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full rounded-t-[30px] p-6 max-h-[80%] overflow-y-auto transform translate-y-full transition-transform duration-300" id="modal-content">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-neutral-100">
                    <h2 class="text-base font-bold text-neutral-800"><i class="fa-solid fa-pen-to-square text-[#005088] mr-1"></i> 安排新景點</h2>
                    <button onclick="closeModal()" class="text-neutral-400 text-lg hover:text-neutral-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="place-form" onsubmit="saveNewPlace(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-bold text-neutral-700 mb-1">景點名稱 *</label>
                        <input type="text" id="form-name" required placeholder="例如：東京晴空塔、清水寺..." class="w-full border border-neutral-300 rounded-xl p-2.5 focus:outline-none focus:border-[#005088]">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-neutral-700 mb-1">開始時間</label>
                            <input type="time" id="form-start" class="w-full border border-neutral-300 rounded-xl p-2.5 focus:outline-none focus:border-[#005088]">
                        </div>
                        <div>
                            <label class="block font-bold text-neutral-700 mb-1">結束時間</label>
                            <input type="time" id="form-end" class="w-full border border-neutral-300 rounded-xl p-2.5 focus:outline-none focus:border-[#005088]">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-neutral-700 mb-1">地址 / 位置描述</label>
                        <input type="text" id="form-address" placeholder="輸入地址以便後續導航" class="w-full border border-neutral-300 rounded-xl p-2.5 focus:outline-none focus:border-[#005088]">
                    </div>
                    <div>
                        <label class="block font-bold text-neutral-700 mb-1">手札共編備註</label>
                        <textarea id="form-note" rows="2" placeholder="輸入提醒事項" class="w-full border border-neutral-300 rounded-xl p-2.5 focus:outline-none focus:border-[#005088]"></textarea>
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-[#005088] text-white font-bold py-3 rounded-xl shadow-xs hover:bg-[#003d66] transition">
                            儲存並加入今日行程
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 註冊成功！', reg.scope))
                    .catch(err => console.log('Service Worker 註冊失敗：', err));
            });
        }
        let tripData = JSON.parse(localStorage.getItem('travel_buddy_trip')) || {
            title: "我的新旅程 ✈️",
            destination: "未設定目的地",
            places: []
        };
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ["日", "一", "二", "三", "四", "五", "六"];
            const day = dayNames[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${year}年${month}月${date}日 (${day}) ${hours}:${minutes}`;
            document.getElementById('status-bar-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
        function renderTimeline() {
            const emptyState = document.getElementById('empty-state');
            const timelineFlow = document.getElementById('timeline-flow');
            const titleInput = document.getElementById('trip-title-input');
            const destLabel = document.getElementById('trip-destination');
            titleInput.value = tripData.title;
            if (tripData.places.length === 0) {
                emptyState.classList.remove('hidden');
                timelineFlow.classList.add('hidden');
                destLabel.innerText = "未設定目的地";
                return;
            }
            emptyState.classList.add('hidden');
            timelineFlow.classList.remove('hidden');
            tripData.places.sort((a, b) => (a.startTime || "00:00").localeCompare(b.startTime || "00:00"));
            destLabel.innerText = tripData.places[0].name.substring(0, 4);
            let htmlContent = "";
            tripData.places.forEach((place, index) => {
                htmlContent += `
                    <div class="relative">
                        <div class="absolute -left-[23px] top-4 w-4 h-4 rounded-full bg-white border-4 border-[#005088] flex items-center justify-center shadow-xs"></div>
                        <div class="bg-white rounded-2xl p-4 shadow-xs border border-[#EBE4D5] relative group">
                            <button onclick="deletePlace(${index})" class="absolute right-3 top-3 text-neutral-300 hover:text-red-500 transition text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                            <div class="flex justify-between items-start pr-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold bg-[#E6F0FA] text-[#005088] px-2 py-0.5 rounded-sm font-mono">
                                            \${place.startTime || '未設時間'} \${place.endTime ? '- ' + place.endTime : ''}
                                        </span>
                                    </div>
                                    <h3 class="text-sm font-bold text-neutral-800 mt-1.5">\${place.name}</h3>
                                    \${place.address ? `<p class="text-[11px] text-neutral-400 mt-1"><i class="fa-solid fa-location-dot mr-0.5"></i> \${place.address}</p>` : ''}
                                </div>
                            </div>
                            \${place.note ? `<div class="mt-2.5 bg-[#FAF6EE] border border-[#EBE4D5] rounded-xl p-2.5 text-[11px] text-neutral-600"><span class="font-bold text-neutral-700"><i class="fa-regular fa-comment-dots text-[#005088]"></i> 備註：</span> \${place.note}</div>` : ''}
                            <div class="mt-3">
                                <a href="https://www.google.com/maps/search/?api=1&query=\${encodeURIComponent(place.address || place.name)}" target="_blank" class="w-full bg-[#FAF6EE] text-neutral-700 border border-[#EBE4D5] text-center text-[11px] font-bold py-2 rounded-xl hover:bg-neutral-50 transition flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-location-arrow text-[10px] text-[#005088]"></i> 導航至此景點
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                if (index < tripData.places.length - 1) {
                    htmlContent += `<div class="my-1 py-0.5 pl-2 flex items-center text-[11px] text-neutral-400"><div class="flex items-center gap-1.5 bg-[#F0E8D9]/50 px-2.5 py-1 rounded-full text-neutral-500"><span>🚗 開車/大眾運輸接駁中</span></div></div>`;
                }
            });
            timelineFlow.innerHTML = htmlContent;
        }
        function openModal() {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('translate-y-full'); }, 10);
        }
        document.getElementById('add-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        function closeModal() {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-100'); content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
            document.getElementById('place-form').reset();
        }
        function saveNewPlace(e) {
            e.preventDefault();
            const name = document.getElementById('form-name').value;
            const startTime = document.getElementById('form-start').value;
            const endTime = document.getElementById('form-end').value;
            const address = document.getElementById('form-address').value;
            const note = document.getElementById('form-note').value;
            tripData.places.push({ name, startTime, endTime, address, note });
            localStorage.setItem('travel_buddy_trip', JSON.stringify(tripData));
            closeModal(); renderTimeline();
        }
        function deletePlace(index) {
            if(confirm("確定要刪除這個行程景點嗎？")) {
                tripData.places.splice(index, 1);
                localStorage.setItem('travel_buddy_trip', JSON.stringify(tripData));
                renderTimeline();
            }
        }
        function saveTripTitle(val) {
            tripData.title = val;
            localStorage.setItem('travel_buddy_trip', JSON.stringify(tripData));
        }
        function clearAllData() {
            if(confirm("確定要清空所有資料嗎？")) {
                tripData = { title: "我的新旅程 ✈️", destination: "未設定目的地", places: [] };
                localStorage.removeItem('travel_buddy_trip');
                renderTimeline();
            }
        }
        renderTimeline();
    </script>
</body>
</html>
